<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Temple Album featuring beautiful temples from around the world.">

    <meta name="author" content="Daniella Isiuwa-Daniel">

    <title>Temple Album</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="styles/temples.css">
    <link rel="stylesheet" href="styles/temples-large.css">

    <script src="scripts/temples.js" defer></script>
</head>

<body>

    <header>
        <div class="header-content">
            <span class="site-title">Temple Album</span>

            <button id="menu-button" class="hamburger" aria-label="Open navigation menu">
                ☰
            </button>
        </div>
        <nav id="navigation">


            <a href="#" class="active">Home</a>
            <a href="#">Old</a>
            <a href="#">New</a>
            <a href="#">Large</a>
            <a href="#">Small</a>
        </nav>



    </header>

    <main>
        <h1>Temple Album</h1>

        <div class="temple-grid">

            <figure>
                <img src="images/salt-lake-temple.jpg"
                    alt="Temple placeholder image" loading="lazy">
                <figcaption>Salt Lake Temple</figcaption>
            </figure>

            <figure>
                <img src="images/accra-ghana-temple.jpg"
                    alt="Temple placeholder image" loading="lazy">
                <figcaption>Accra Ghana Temple</figcaption>
            </figure>

            <figure>
                <img src="images/switzerland-temple.jpg"
                    alt="Temple placeholder image" loading="lazy">
                <figcaption>Bern Switzerland Temple</figcaption>
            </figure>

            <figure>
                <img src="images/rome-temple.jpg"
                    alt="Temple placeholder image" loading="lazy">
                <figcaption>Rome Italy Temple</figcaption>
            </figure>

            <figure>
                <img src="images/paris-temple.jpg"
                    alt="Temple placeholder image" loading="lazy">
                <figcaption>Paris France Temple</figcaption>
            </figure>

            <figure>
                <img src="images/london-temple.jpg"
                    alt="Temple placeholder image" loading="lazy">
                <figcaption>London England Temple</figcaption>
            </figure>

            <figure>
                <img src="images/nairobi-kenya-temple.jpeg"
                    alt="Temple placeholder image" loading="lazy">
                <figcaption>Nairobi Kenya Temple</figcaption>
            </figure>

            <figure>
                <img src="images/johannesburg-temple.jpg"
                    alt="Temple placeholder image" loading="lazy">
                <figcaption>Johannesburg South Africa Temple</figcaption>
            </figure>

            <figure>
                <img src="images/washington-temple.jpeg"
                    alt="Temple placeholder image" loading="lazy">
                <figcaption>Washington D.C. Temple</figcaption>
            </figure>

        </div>
    </main>

    <footer>
        <p>
            &copy; <span id="currentyear"></span> ❤️Daniella Isiuwa-Daniel ❤️| Nigeria
        </p>

        <p id="lastModified"></p>
    </footer>

</body>

</html>
